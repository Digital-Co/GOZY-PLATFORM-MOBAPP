# import 'package:gozy/graphql/inspection/inspection_fragment.graphql'

fragment inspectionResultFragment on InspectionResult {
  status
  errorMessage
  windowOpen
  windowReason
  opensAt
  closesAt
  viewerRole
  inspectionEnabled
  photoMin
  photoMax
  viewerReview {
    id
    rating
    reviewContent
  }
  inspection {
    ...inspectionFragment
  }
}
