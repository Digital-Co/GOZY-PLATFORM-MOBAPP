query getPayouts{
  getPayouts  {
    results {
     id
    methodId
    paymentMethod{
         id
         name

    }
    userId
    payEmail
    address1
    address2
    city
    default
    state
    country
    zipcode
    currency
    createdAt
   last4Digits
    isVerified
    status
    }
    status
    errorMessage
  }
}

mutation confirmPayout ($currentAccountId: String) {
  confirmPayout (currentAccountId: $currentAccountId) {
    status
    errorMessage
  }
}


mutation setDefaultPayout($id: Int!, $type: String!) {
    setDefaultPayout(id: $id, type: $type) {
        status
        errorMessage
    }
}


query getPaymentMethods($operation: String, $supportedPaymentTypes: [Int!]){
  getPaymentMethods(operation: $operation, supportedPaymentTypes: $supportedPaymentTypes) {
    results {
      id
      name
      processedIn
      fees
      currency

      details
      isEnable
      paymentType
      imageUrl
    }
    status
    errorMessage
  }
}

mutation addPayout(
    $methodId: Int!,
    $payEmail: String!,
    $address1: String!,
    $address2: String!,
    $city: String!,
    $state: String!,
    $country: String!,
    $zipcode: String!,
    $currency: String!,
    $firstname: String,
    $lastname: String,
    $accountNumber: String,
    $routingNumber: String,
    $businessType: String,
    $accountToken: String,
    $personToken: String,
) {
    addPayout (
        methodId: $methodId
        payEmail: $payEmail
        address1: $address1
        address2: $address2
        city: $city
        state: $state
        country: $country
        zipcode: $zipcode
        currency: $currency,
        firstname: $firstname,
        lastname: $lastname,
        accountNumber: $accountNumber,
        routingNumber: $routingNumber,
        businessType: $businessType,
        accountToken: $accountToken,
        personToken: $personToken
    ) {
        status
        errorMessage
        connectUrl
        successUrl
        failureUrl
        stripeAccountId
    }
}


mutation verifyPayout(
  	$stripeAccount: String
) {
    verifyPayout (
    stripeAccount: $stripeAccount
    ) {
        status
        errorMessage
        connectUrl
        successUrl
        failureUrl
        stripeAccountId
    }
}

query getPawaPayOptions($operation: PawaPayOperation!) {
  getPawaPayOptions(operation: $operation) {
    status
    errorMessage
    recommendedCountry
    countries {
      country
      displayName
      prefix
      flag
      currencies {
        currency
        providers {
          provider
          displayName
        }
      }
    }
  }
}

mutation initiatePawaPayDeposit($reservationId: Int!, $country: String!, $currency: String!, $phoneNumber: String!, $provider: String!) {
  initiatePawaPayDeposit(reservationId: $reservationId, country: $country, currency: $currency, phoneNumber: $phoneNumber, provider: $provider) {
    status
    errorMessage
    depositId
    paymentStatus
  }
}

query getPawaPayDepositStatus($reservationId: Int!) {
  getPawaPayDepositStatus(reservationId: $reservationId) {
    status
    errorMessage
    paymentStatus
    reservation {
      id
      paymentState
      reservationState
    }
  }
}

mutation addPawaPayPayoutAccount($phoneNumber: String!, $country: String!, $currency: String!, $provider: String!) {
  addPawaPayPayoutAccount(phoneNumber: $phoneNumber, country: $country, currency: $currency, provider: $provider) {
    status
    errorMessage
    result {
      id
      methodId
      payEmail
      address1
      country
      currency
      default
      isVerified
    }
  }
}
